    <title>Joel · Webs a medida & Automatización con IA</title>
    <script>
      /* ── Entrar siempre por el principio de la página ──────────────────────
         Este script se ejecuta ANTES de que el navegador restaure la posición
         de scroll de la visita anterior. Sin esto, al recargar la página se
         abría directamente en el apartado de automatizaciones.
         Se respeta el ancla (#contacto, #web…) si el enlace la trae.        */
      (function () {
        try {
          if ("scrollRestoration" in history) history.scrollRestoration = "manual";
          if (!location.hash) {
            window.scrollTo(0, 0);
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
